name: Build and Release

# 推送 v* 标签时自动编译并发布 Release；也可在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 版本号只读 csproj 一处，文件名与窗口标题永远一致
      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path JegServiceStarter.csproj -Pattern '<Version>(.*?)</Version>').Matches[0].Groups[1].Value
          $short = ($v.Split('.')[0..1]) -join '.'
          "full=$v" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT

      # JegExportRunning=1 用于跳过 csproj 里本地导出用的 ExportToExportFolder 目标
      - name: Publish single-file EXE
        run: dotnet publish JegServiceStarter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:JegExportRunning=1 -o publish

      - name: Rename with version
        shell: pwsh
        run: Copy-Item publish/JegServiceStarter.exe "JegServiceStarter${{ steps.ver.outputs.short }}.exe"

      # 标签触发用推送的标签名；手动触发按 csproj 版本号生成
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v" + "${{ steps.ver.outputs.short }}" }
          $exe = "JegServiceStarter${{ steps.ver.outputs.short }}.exe"
          $notes = "局域网 Web 服务器快速启动器 $tag | Instant LAN web server starter $tag`n`n- 自包含单文件，下载后双击即用，无需安装 .NET | Self-contained single file, no .NET needed`n- 首次启动需解压本地库，稍慢 1-2 秒属正常 | First launch extracts native libraries`n- 未签名 EXE 可能触发 SmartScreen，点击 Run anyway 即可 | Unsigned EXE may trigger SmartScreen, click Run anyway"
          gh release create "$tag" "$exe" --title "$tag" --notes "$notes" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release upload "$tag" "$exe" --clobber }
